<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Raihan AI - Ultimate Edition</title>
  
  <link rel="stylesheet" href="style.css"/>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  
  <div class="cyber-bg">
    <div class="grad-blob purple"></div>
    <div class="grad-blob blue"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="app-container">
    
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div class="logo">
          <div class="logo-icon"><i class="ri-robot-2-line"></i></div>
          <span>Raihan AI</span>
        </div>
        <button id="close-sidebar" class="icon-btn mobile-only"><i class="ri-close-line"></i></button>
      </div>

      <button id="new-chat-btn" class="btn-primary glow-effect">
        <i class="ri-add-line"></i> New Session
      </button>

      <div class="history-section">
        <span class="label">Time Travel</span>
        <div id="history-list" class="history-list custom-scroll">
          </div>
      </div>

      <div class="sidebar-foot">
        <button id="clear-all-btn" class="btn-ghost" title="Wipe Memory"><i class="ri-delete-bin-5-line"></i></button>
        <button id="settings-btn" class="btn-ghost" title="System Settings"><i class="ri-settings-4-line"></i></button>
      </div>
    </aside>

    <main class="main-chat">
      
      <header class="top-bar">
        <button id="hamburger-btn" class="icon-btn mobile-only"><i class="ri-menu-4-line"></i></button>
        <div class="chat-meta">
            <span class="status-dot"></span>
            <span class="model-name">Raihan-Pro-v1.0</span>
        </div>
        <div class="header-actions">
            <button id="theme-toggle" class="icon-btn"><i class="ri-moon-line"></i></button>
            <button id="copy-chat-btn" class="icon-btn" title="Copy Conversation"><i class="ri-file-copy-line"></i></button>
        </div>
      </header>

      <div id="chat-box" class="chat-area custom-scroll">
        
        <div id="welcome-screen" class="welcome-container">
          <div class="hologram-logo">
             <i class="ri-openai-fill"></i>
          </div>
          <h1 class="glitch-text" data-text="WELCOME TO RAIHAN AI">WELCOME TO RAIHAN AI</h1>
          <div class="typing-wrapper">
             <span id="typing-text"></span><span class="cursor">Powered by Google</span>
          </div>

          <div class="feature-grid">
             <div class="f-card" onclick="setInput('Buatkan script Python untuk kalkulator')">
                <i class="ri-code-box-line"></i>
                <span>Generate Code</span>
             </div>
             <div class="f-card" onclick="setInput('Analisis tren teknologi 2025')">
                <i class="ri-bar-chart-grouped-line"></i>
                <span>Analyze Data</span>
             </div>
             <div class="f-card" onclick="setInput('Buatkan caption Instagram aesthetic')">
                <i class="ri-quill-pen-line"></i>
                <span>Creative Writing</span>
             </div>
          </div>
        </div>

      </div>

      <div class="input-zone">
        <div id="voice-overlay" class="voice-status hidden">
            <div class="sound-wave">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <span>Listening...</span>
        </div>

        <button id="stop-btn" class="stop-gen-btn hidden">
            <i class="ri-stop-circle-line"></i> Stop Generating
        </button>

        <form id="chat-form" class="input-capsule">
           <button type="button" id="emoji-btn" class="tool-btn"><i class="ri-emotion-line"></i></button>
           
           <textarea id="user-input" placeholder="Type a command or ask anything..." rows="1"></textarea>
           
           <button type="button" id="voice-btn" class="tool-btn"><i class="ri-mic-line"></i></button>
           
           <button type="submit" id="send-btn" class="send-btn" disabled>
             <i class="ri-send-plane-fill"></i>
             <div class="spinner"></div>
           </button>
        </form>
        <p class="disclaimer">Raihan AI can make mistakes. Check important info.</p>
      </div>

      <div id="emoji-picker" class="emoji-picker hidden"></div>

    </main>
  </div>

  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>System Settings</h3>
            <button id="close-settings"><i class="ri-close-line"></i></button>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label>AI Persona</label>
                <select id="persona-select">
                    <option value="default">Default Assistant</option>
                    <option value="coder">Senior Developer (Code Focus)</option>
                    <option value="friend">Best Friend (Casual)</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Response Speed</label>
                <div class="range-wrapper">
                    <span>Precise</span> <input type="range" min="0" max="100"> <span>Creative</span>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-primary" onclick="document.getElementById('settings-modal').classList.add('hidden')">Save Changes</button>
        </div>
    </div>
  </div>

  <div id="toast" class="toast hidden">
    <i class="ri-checkbox-circle-line"></i> <span id="toast-msg">Success</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
